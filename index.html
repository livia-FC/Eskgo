main{max-width:1100px;margin:0 auto;padding:0 18px calc(110px + var(--sb))}
.view{display:none}.view.on{display:block;animation:in .3s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.eb{font-size:11px;color:var(--mu);margin-top:22px;text-transform:uppercase;letter-spacing:.4px}
h1{font-size:30px;letter-spacing:-.5px;line-height:1.15;margin-top:4px}.sub{color:var(--mu);margin-top:4px}
.grid{display:grid;gap:18px;margin-top:20px}.grid>*{min-width:0}
.card{border:1px solid var(--border);border-radius:24px;padding:18px 20px;background:var(--bg-app);min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
h2{font-size:15px}.mu{color:var(--mu);font-size:12px}
.lk{background:none;border:0;color:var(--li);font-size:12px;padding:6px 2px}
.bal{border-radius:24px;padding:22px 24px;min-height:140px;color:#101010;background:linear-gradient(124deg,#f9f9f9 0%,#e85102 43%,#ce1f00 75%,#8c0600 93%)}
.bal small{font-size:11px;color:#3a3640}.amt{min-height:46px;font-size:38px;font-weight:700;display:flex;align-items:center;gap:16px;margin-top:4px;line-height:1.2}
.amt>span{display:inline-block;letter-spacing:.02em}.amt>span.h{letter-spacing:-.04em;font-size:min(38px,calc((100vw - 146px)/6.4))}.pop{animation:pop .28s var(--ease)}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.94)}}.eye.off{color:#f3e6df}.eye{background:none;border:0;color:#101010;display:grid;place-items:center;padding:6px}
.pill{display:inline-block;background:rgba(255,255,255,.88);color:#333;border-radius:20px;padding:4px 10px;font-size:11px;margin-right:8px}.bal .v{margin-top:6px;font-size:12px;color:#fff}
.acts{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;margin-top:14px}
.act{min-height:56px;border-radius:18px;border:1px solid var(--border);background:none;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.act.p{background:var(--or);border-color:var(--or);color:#101010;font-weight:700}.act>span{font-size:18px;line-height:1}.act.p>span{font-size:26px;font-weight:400}
.big{font-size:30px;font-weight:700;margin-top:8px}
.bar{height:6px;border-radius:6px;background:#34343a;overflow:hidden;margin:10px 0 6px}.bar b{display:block;height:100%;background:var(--cy);border-radius:6px;transition:width .4s var(--ease)}.bar b.o{background:var(--or7)}
.cat{display:block;width:100%;background:none;border:0;border-top:1px solid #2a2a2e;padding:12px 0;text-align:left}
.cat .row b{font-size:13px}.cat .bar{margin:8px 0 0;height:5px}
.tx{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid #2a2a2e;padding:12px 0;text-align:left}
.lg{flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface-raised);display:grid;place-items:center;font-weight:700;color:var(--li)}
.tx .t{flex:1;min-width:0}.tx .t b,.tx .t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx .t span{font-size:12px;color:var(--mu)}.tx em{font-style:normal;font-size:13px;white-space:nowrap}
.track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;scrollbar-width:none;cursor:grab}.track::-webkit-scrollbar{display:none}.track.d{scroll-snap-type:none;cursor:grabbing;user-select:none}
.vc{flex:0 0 min(380px,calc(100% - 40px));aspect-ratio:1.75;border-radius:24px;padding:20px;position:relative;color:#101010;scroll-snap-align:start;opacity:.6;transform:scale(.94);transition:transform .35s var(--ease),opacity .35s}
.vc.on{opacity:1;transform:none}.vc.lt{color:#fff}.vc b{font-size:24px}.vc em{position:absolute;right:20px;top:20px;font-weight:700;font-size:18px}
.vc .tg{position:absolute;left:20px;top:58px;background:#fff;color:#101010;font-size:11px;padding:4px 10px;border-radius:12px}.crow{display:flex;align-items:center;gap:6px;margin-top:10px}.crow .sp{flex:1;min-width:0}.crow .pg{min-width:0;overflow:hidden;flex:0 1 auto}.ib{flex:none;min-width:40px;height:40px;border-radius:14px;border:0;background:#2a2a2d;color:#e9e9ec;display:grid;place-items:center;padding:0}.ib.wd{padding:0 12px;font-size:13px;white-space:nowrap}.crow .pg{margin:0}.crow>.ib:first-of-type{background:#2a2a2d;border-radius:50%;width:40px}.vc .bl,.vc .br{position:absolute;bottom:18px;font-size:13px}.vc .bl{left:20px}.vc .br{right:20px}
.pg{display:flex;gap:7px;align-items:center;background:#38383b;border-radius:30px;padding:8px 11px;width:max-content;margin-top:8px}
.pg button{width:12px;height:12px;border-radius:12px;border:0;background:#a8a8ad;padding:0;transition:width .35s var(--ease),height .35s var(--ease)}.pg button.on{width:30px;height:14px;background:#cbcbd0}
.pg:empty{display:none}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #2a2a2e}.kv:first-of-type{border:0}
